# Docker Compose for Hugging Face Spaces deployment (mock mode)
# Usage: docker compose -f docker-compose.hf.yml up --build

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aletheia
      POSTGRES_PASSWORD: aletheia
      POSTGRES_DB: aletheia
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aletheia -d aletheia"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://aletheia:aletheia@db:5432/aletheia
      MOCK_RETRIEVAL: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "7860:8000"  # HF Spaces expects port 7860
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "poetry install && poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  pgdata: